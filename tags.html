---
title: Tags
permalink: /tags/
---
<h1>Tags</h1>
{% assign tags = site.tags | sort %}
<p class="tag-cloud">
  {% for tag in tags %}<a class="tag" href="#{{ tag[0] | slugify }}">{{ tag[0] }} <small>{{ tag[1].size }}</small></a>{% endfor %}
</p>
{% for tag in tags %}
<section class="year">
  <h2 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h2>
  <ul class="post-list">
    {% for post in tag[1] %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y' }}</time>
      <div><a href="{{ post.url | relative_url }}">{{ post.title }}</a></div>
    </li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
